<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/voxdetect-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VoxDetect — Real-time AI voice cloning detection and prevention for enterprise security." />
    <meta name="theme-color" content="#0d1117" />
    <title>VoxDetect — Voice Authenticity Monitor</title>
    <script>
      // Apply saved theme before first paint to avoid a dark/light flash.
      (function () {
        try {
          var t = localStorage.getItem('voxdetect-theme');
          var root = document.documentElement;
          if (t === 'light') root.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
